# Builds the CLANG64 gnustep-back package from the carry branch
# (packaging/msys2/PKGBUILD). A tag carry-0.32.0.N publishes it as a release,
# which gnustep-packager's workflow installs over MSYS2's own package.
name: msys2-package

on:
  push:
    branches: [carry]
    tags: ['carry-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            rsync
            base-devel
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-autotools
            mingw-w64-clang-x86_64-gnustep-make
            mingw-w64-clang-x86_64-gnustep-base
            mingw-w64-clang-x86_64-gnustep-gui
            mingw-w64-clang-x86_64-cairo

      - name: Build the package
        run: |
          cd packaging/msys2
          MINGW_ARCH=clang64 makepkg-mingw -Cf --nocheck

      - uses: actions/upload-artifact@v4
        with:
          name: gnustep-back-clang64
          path: packaging/msys2/*.pkg.tar.zst

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/carry-')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-ChildItem packaging/msys2/*.pkg.tar.zst | Select-Object -First 1
          gh release create "${{ github.ref_name }}" $pkg.FullName `
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" `
            --notes-file packaging/README.md
